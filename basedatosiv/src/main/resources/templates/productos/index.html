<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::contenido})}">
<head>
    <title>Productos</title>
</head>
<body>
    <div th:fragment="contenido">

        <!-- Mensajes (Fase 5) -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!-- Sección 1: Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li class="breadcrumb-item active" aria-current="page">Productos</li>
            </ol>
        </nav>

        <!-- Sección 2: Título -->
        <h2 class="mb-3">Catálogo de productos</h2>

        <!-- Sección 3: Tabla -->
        <button type="button" id="btnNuevoProducto" name="nuevoProducto" class="btn btn-primary mb-3"
                data-bs-toggle="modal" data-bs-target="#nuevoProducto">
            <i class="fa-solid fa-plus"></i> Nuevo producto
        </button>

        <div class="table-responsive">
            <table id="productos" class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>id</th>
                        <th>nombre</th>
                        <th>precio</th>
                        <th>categoria</th>
                        <th>stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${p.categoria}"></td>
                        <td th:text="${p.stock}"></td>
                        <td class="text-nowrap">
                            <a th:href="@{/productos/ver/{id}(id=${p.id})}" title="Ver"
                               class="btn btn-info btn-sm p-0 d-inline-flex align-items-center justify-content-center"
                               style="width:24px;height:24px;font-size:12px;">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <button type="button" title="Modificar"
                                    class="btn btn-warning btn-sm p-0 d-inline-flex align-items-center justify-content-center"
                                    style="width:24px;height:24px;font-size:12px;">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button type="button" title="Eliminar"
                                    class="btn btn-danger btn-sm p-0 d-inline-flex align-items-center justify-content-center"
                                    style="width:24px;height:24px;font-size:12px;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6" class="text-center text-muted">No hay productos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Ventana modal nuevoProducto (Fase 5.2) -->
        <div class="modal fade" id="nuevoProducto" tabindex="-1" aria-labelledby="nuevoProductoLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/productos/nuevo}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="nuevoProductoLabel">Nuevo producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="id" class="form-label">id</label>
                                <input type="text" class="form-control" id="id" name="id"
                                       placeholder="Opcional: si se deja vacío MongoDB lo genera">
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">precio</label>
                                <input type="number" class="form-control" id="precio" name="precio" min="0" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">categoria</label>
                                <input type="text" class="form-control" id="categoria" name="categoria" required>
                            </div>
                            <div class="mb-3">
                                <label for="stock" class="form-label">stock</label>
                                <input type="number" class="form-control" id="stock" name="stock" min="0" step="1" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
